# ============================================================
# fail2ban filter · 研报站点（读 Caddy 访问日志）
# 放置路径：/etc/fail2ban/filter.d/caddy-research-reports.conf
#
# 职责：从网络层封禁「持续尝试认证」或「反复触发限流」的 IP。
#   与应用层 slowapi 的分工：
#     slowapi   —— 瞬时配额（如 10 次/分钟），拦住爆发式冲击
#     fail2ban  —— 长周期封禁（如 10 分钟 15 次），拦住「慢速试探」
#   慢速爆破每分钟只试几次、永不触发应用层阈值，只有 fail2ban 能治。
#
# Caddy 日志格式（deploy/Caddyfile 里 log { format console }）：
#   2026/09/16 04:42:06.255	INFO	http.log.access.log0	handled request	{"request": {"remote_ip": "1.2.3.4", ..., "uri": "/api/auth/login", ...}, "status": 401, ...}
#
# 注意要点：
#   1) JSON 里冒号后有空格 —— 正则必须写成 "remote_ip": "<HOST>" 带空格，
#      写成 "remote_ip":"<HOST>" 会一条都匹配不到（容易被误判为 filter 失效）
#   2) remote_ip 与 uri 同在 request 对象内，但中间夹着 headers 子对象（含 }），
#      所以只能用 .* 跨越，不能图快用 [^}]*
#   3) 只匹配**认证类路径**的失败，避免把普通 403（如越权访问）也算进去
# ============================================================

[Definition]

# fail2ban 的多模式写法：只有第一行带 `failregex =`，后续行**缩进续写**即视为 OR。
# 若每行都写 `failregex =`，后面的会覆盖前面，只剩最后一条生效 —— 这是常见坑。
failregex = ^.*"remote_ip": "<HOST>".*"uri": "/api/auth/(login|register)(\?[^"]*)?"[^}]*.*"status": (401|403|409|429)\b.*$
            ^.*"remote_ip": "<HOST>".*"status": 429\b.*$

ignoreregex =

# 模式含义：
#   第 1 条 —— 认证类路径上的失败/受限：
#       401 登录密码错误
#       403 权限不足
#       409 注册时邮箱已存在（批量刷号的典型特征）
#       429 该路径触发应用层限流
#   第 2 条 —— 任意路径返回 429：说明这个 IP 在异常高频调用，
#       即便不在认证路径上也该封（例如狂刷公开接口）
#
# 已刻意排除 /demo/*（redis-demo）的 401 —— 那不是攻击特征。
# 第 1 条的路径限定已经保证了这一点。
