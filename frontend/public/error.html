<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>服务暂时不可用 · 上市公司研报</title>
<!--
  错误页（B11）

  为什么要独立成文件而不是写在 Caddyfile 里：
    1. 内联样式 + 无外部依赖 —— 服务挂了的时候，CSS/JS 请求多半也拿不到，
       所以这一页必须自己带全套样式才能正常显示
    2. 复用方便 —— Caddy 的 handle_errors 指过来即可，不必在配置里塞大段 HTML
    3. 可本地预览 —— 构建后直接在浏览器打开 dist/error.html 就能看效果
-->
<style>
  :root { --bg:#f7f8fa; --card:#fff; --text:#1f2329; --muted:#8a919f; --line:#e5e7eb; --brand:#185fa5; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.7;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 24px;
  }
  .box {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 36px 40px; max-width: 460px; width: 100%; text-align: center;
    box-shadow: 0 4px 24px rgba(24, 95, 165, .08);
  }
  .icon {
    width: 56px; height: 56px; line-height: 56px; margin: 0 auto 18px;
    border-radius: 50%; background: #fcebeb; color: #a32d2d;
    font-size: 28px; font-weight: 600;
  }
  h1 { font-size: 20px; margin-bottom: 14px; color: #a32d2d; }
  .msg { color: #4b5563; font-size: 14px; margin-bottom: 6px; }
  .sub { color: var(--muted); font-size: 13px; margin-top: 16px; line-height: 1.9; }
  .actions { margin-top: 22px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  a.btn {
    display: inline-block; padding: 9px 20px; font-size: 13px; border-radius: 8px;
    text-decoration: none; border: 1px solid var(--line); color: var(--text); background: #fff;
  }
  a.btn.primary { background: var(--brand); color: #fff; border-color: var(--brand); }
  .foot { margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--line);
          color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
  <div class="box">
    <div class="icon">!</div>
    <h1>研报测试网站崩了</h1>
    <p class="msg">已自动邮件通知，马上修复</p>
    <p class="sub">
      请稍后刷新重试。<br>
      如果长时间无法访问，说明修复仍在进行中。
    </p>
    <div class="actions">
      <a class="btn primary" href="/">刷新重试</a>
      <a class="btn" href="http://www.cninfo.com.cn/" target="_blank" rel="noopener">去巨潮看原文</a>
    </div>
    <p class="foot">
      本站研报由 AI 基于巨潮资讯网公开信息生成，仅供研究参考，不构成投资建议。
    </p>
  </div>
</body>
</html>
